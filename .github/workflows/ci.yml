name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dev dependencies (tests only; nothing ships to users)
        run: npm ci
      - name: JS syntax check
        run: npm run check:syntax
      - name: Guardrails (no third-party libs, HTML injection or unencrypted storage)
        run: npm run check:guardrails
      - name: PWA check (offline cache list and manifest)
        run: npm run check:pwa
      - name: Unit and end-to-end tests
        run: npm test
      - name: Bundle size budget
        run: npm run check:size
      - name: Dependency audit (high and critical, production dependencies)
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (boots real Pyodide sandboxes, about 2 minutes)
        run: npm test
      - name: Dependency audit (high and critical, production dependencies)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (full Git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan every commit, not just the latest
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}