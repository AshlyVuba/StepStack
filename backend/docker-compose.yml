services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: skills
    ports: ["127.0.0.1:5432:5432"]   # loopback only: reachable from this machine, not from the network
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 24)}"]
    ports: ["127.0.0.1:6379:6379"]   # loopback only
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://skills:${POSTGRES_PASSWORD}@postgres:5432/skills
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on: [postgres, redis]
    ports: ["3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  pgdata: {}