# Lightweight production stack: PostgreSQL + Fastify API serving pre-compiled 11-language
# static lesson packs. No live local CPU/GPU LLM inference container is required or provisioned.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: skills
    ports: ["127.0.0.1:5432:5432"]   # loopback only: reachable from this machine, not from the network
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://skills:${POSTGRES_PASSWORD}@postgres:5432/skills
      LESSON_PACKS_DIR: /app/lesson-packs
    depends_on: [postgres]
    ports: ["3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  pgdata: {}
