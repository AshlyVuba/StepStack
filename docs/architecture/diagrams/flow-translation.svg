<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ft-title ft-desc">
  <title id="ft-title">StepStack 11-Language Pre-Translated Offline Lesson Pack Flow</title>
  <desc id="ft-desc">Build-time syntax-locked compilation of 11 South African language JSON lesson packs served statically and cached in Service Worker and IndexedDB for 100% offline use with zero live LLM inference at runtime.</desc>
  <defs>
    <marker id="ft-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0b5a54"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="800" fill="#12202b">Pre-Translated 11-Language Offline Lesson Pack Flow</text>
  <text x="24" y="54" font-size="12" fill="#52626e">Build-time syntax-lock compilation · Zero live CPU/GPU LLM inference at runtime · 100% offline PWA delivery</text>

  <!-- Actors -->
  <g stroke="#0b5a54" stroke-width="1.4">
    <rect x="24" y="74" width="164" height="48" rx="6" fill="#0f766e"/>
    <rect x="210" y="74" width="164" height="48" rx="6" fill="#0f766e"/>
    <rect x="396" y="74" width="176" height="48" rx="6" fill="#0f766e"/>
    <rect x="594" y="74" width="176" height="48" rx="6" fill="#0f766e"/>
    <rect x="792" y="74" width="144" height="48" rx="6" fill="#0f766e"/>
  </g>
  <g fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">
    <text x="106" y="95">Build CLI</text><text x="106" y="111" font-weight="400" font-size="10.5">build-lesson-packs.ts</text>
    <text x="292" y="95">Syntax Lock</text><text x="292" y="111" font-weight="400" font-size="10.5">protect.ts + sanitize.ts</text>
    <text x="484" y="95">Static Lesson Packs</text><text x="484" y="111" font-weight="400" font-size="10.5">/packs/*.json · /v1/lesson-packs</text>
    <text x="682" y="95">Offline Cache</text><text x="682" y="111" font-weight="400" font-size="10.5">sw.js + IndexedDB (packs)</text>
    <text x="864" y="95">Learner PWA</text><text x="864" y="111" font-weight="400" font-size="10.5">100% Offline</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#0b5a54" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6">
    <line x1="106" y1="122" x2="106" y2="540"/>
    <line x1="292" y1="122" x2="292" y2="540"/>
    <line x1="484" y1="122" x2="484" y2="540"/>
    <line x1="682" y1="122" x2="682" y2="540"/>
    <line x1="864" y1="122" x2="864" y2="540"/>
  </g>

  <!-- Phase 1: Build / CI -->
  <rect x="24" y="138" width="548" height="28" rx="4" fill="#fff7e0" stroke="#e0a82e"/>
  <text x="298" y="156" font-size="11.5" font-weight="700" fill="#7a5600" text-anchor="middle">BUILD / CI TIME — Compile &amp; verify all 11 official SA languages once (no runtime LLM server)</text>

  <line x1="106" y1="188" x2="286" y2="188" stroke="#0b5a54" stroke-width="1.6" marker-end="url(#ft-arrow)"/>
  <text x="196" y="182" font-size="11" fill="#12202b" text-anchor="middle">Read data/exercises.json</text>

  <rect x="206" y="200" width="172" height="44" rx="4" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="292" y="218" font-size="10.5" fill="#12202b" text-anchor="middle">Lock =SUM(A1:A5), =B2*B3*B4,</text>
  <text x="292" y="233" font-size="10.5" fill="#12202b" text-anchor="middle">Python code &amp; verifySyntaxLock()</text>

  <line x1="292" y1="262" x2="112" y2="262" stroke="#0b5a54" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ft-arrow)"/>
  <text x="196" y="256" font-size="11" fill="#12202b" text-anchor="middle">Verified 11-language packs</text>

  <line x1="106" y1="292" x2="478" y2="292" stroke="#0b5a54" stroke-width="1.6" marker-end="url(#ft-arrow)"/>
  <text x="292" y="286" font-size="11" fill="#12202b" text-anchor="middle">Emit versioned JSON bundles (en, zu, xh, af, nso, tn, st, ts, ss, ve, nr)</text>

  <!-- Phase 2: Runtime -->
  <rect x="396" y="316" width="540" height="28" rx="4" fill="#d6f0e3" stroke="#0f766e"/>
  <text x="666" y="334" font-size="11.5" font-weight="700" fill="#0a5236" text-anchor="middle">LEARNER RUNTIME — Instant local lookup (0 live LLM calls per student click)</text>

  <line x1="864" y1="368" x2="688" y2="368" stroke="#0b5a54" stroke-width="1.6" marker-end="url(#ft-arrow)"/>
  <text x="776" y="362" font-size="11" fill="#12202b" text-anchor="middle">Select language (e.g. zu / nso)</text>

  <!-- Alt box -->
  <rect x="440" y="382" width="460" height="142" rx="6" fill="none" stroke="#0f766e" stroke-dasharray="4 3" stroke-width="1.3"/>
  <rect x="440" y="382" width="128" height="22" rx="3" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="504" y="397" font-size="10.5" font-weight="700" fill="#0b5a54" text-anchor="middle">alt [cached offline]</text>

  <line x1="682" y1="422" x2="858" y2="422" stroke="#0b5a54" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ft-arrow)"/>
  <text x="770" y="416" font-size="11" fill="#0a5236" text-anchor="middle">Return pack from IndexedDB / SW cache</text>

  <line x1="440" y1="440" x2="900" y2="440" stroke="#0f766e" stroke-dasharray="3 3"/>
  <text x="512" y="456" font-size="10.5" font-weight="700" fill="#52626e">[first online download]</text>

  <line x1="682" y1="474" x2="490" y2="474" stroke="#0b5a54" stroke-width="1.6" marker-end="url(#ft-arrow)"/>
  <text x="586" y="468" font-size="11" fill="#12202b" text-anchor="middle">GET /packs/{lang}.json</text>

  <line x1="484" y1="498" x2="676" y2="498" stroke="#0b5a54" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ft-arrow)"/>
  <text x="586" y="492" font-size="11" fill="#12202b" text-anchor="middle">200 OK (Cache-Control + ETag)</text>

  <line x1="682" y1="516" x2="858" y2="516" stroke="#0b5a54" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ft-arrow)"/>
  <text x="770" y="512" font-size="10.5" fill="#12202b" text-anchor="middle">Cache in SW + IDB &amp; render offline</text>
</svg>
