<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">StepStack end-to-end system architecture</title><desc id="d">Learner device (PWA), backend API with grading, translation and portfolio modules, PostgreSQL, Redis, and external services. Dashed arrows are designed but not yet connected.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5a54"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6b00"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52626e"/></marker>
</defs>
<rect width="1400" height="800" fill="#ffffff"/>
<text x="24" y="40" font-size="22" font-weight="800" fill="#12202b" text-anchor="start">StepStack: end-to-end system architecture</text>
<text x="24" y="62" font-size="12.5" font-weight="400" fill="#52626e" text-anchor="start">Frontend (learner device) and backend as they exist in the repository today</text>
<line x1="24" y1="86" x2="64" y2="86" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="72" y="90" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="start">Implemented in code and tested</text>
