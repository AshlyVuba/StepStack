<text x="318" y="90" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="start">Designed, not yet connected</text>
<rect x="488" y="77" width="22" height="16" rx="4" fill="#fff7e0" stroke="#e0a82e" stroke-dasharray="4 3" stroke-width="1.4"/>
<text x="518" y="90" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="start">Not in this repository</text>
<rect x="660" y="77" width="22" height="16" rx="4" fill="#f3f5f7" stroke="#9aa8b2" stroke-width="1.4"/>
<text x="690" y="90" font-size="11.5" font-weight="400" fill="#12202b" text-anchor="start">External service or person</text>
<rect x="24" y="120" width="426" height="650" rx="14" fill="#f0f8f6" stroke="#0f766e" stroke-width="2"/>
<text x="44" y="148" font-size="14" font-weight="800" fill="#0b5a54" text-anchor="start">LEARNER DEVICE</text>
<text x="44" y="165" font-size="11.5" font-weight="400" fill="#52626e" text-anchor="start">Browser or installed PWA (frontend/)</text>
<rect x="96" y="184" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="205" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Screens</text>
<text x="108" y="222" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">index.html · app.js · onboarding.js · workspace.js</text>
<text x="108" y="237" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">setup, unlock, onboarding and 3-stage workspace</text>
<rect x="96" y="262" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="283" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Exercises and local grading</text>
<text x="108" y="300" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">exercises.js · grading.js (both loaded on demand)</text>
<text x="108" y="315" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">English, isiZulu, Afrikaans · practice grading only</text>
<rect x="96" y="340" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="361" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Offline queue</text>
<text x="108" y="378" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">queue.js · encrypted events, sent by flush()</text>
<text x="108" y="393" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">flush() needs a sender; none is registered yet</text>
<rect x="96" y="418" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="439" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Vault</text>
<text x="108" y="456" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">vault.js · crypto.js · AES-256-GCM</text>
<text x="108" y="471" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">personal key in IndexedDB · shared key from passcode</text>
<rect x="96" y="496" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="517" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">IndexedDB database "stepstack"</text>
<text x="108" y="534" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">stores: meta · keys · data · queue</text>
<text x="108" y="549" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">learner data is only ever stored encrypted</text>
<rect x="96" y="600" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="621" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Service worker and Cache Storage</text>
<text x="108" y="638" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">sw.js · 21 entries pre-cached for offline use</text>
<text x="108" y="653" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">cache first, refreshed in the background</text>
<rect x="96" y="678" width="328" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="108" y="699" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Idle timer (shared devices only)</text>
<text x="108" y="716" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">idle.js · after 5 minutes idle: clear screens, drop key</text>
<text x="108" y="731" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">warning shown 30 seconds before</text>
<path d="M260.0 246 V262" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="268.0" y="258" font-size="10" font-weight="400" fill="#52626e" text-anchor="start">grade</text>
<path d="M260.0 402 V418" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="268.0" y="414" font-size="10" font-weight="400" fill="#52626e" text-anchor="start">queueAdd</text>
<path d="M260.0 480 V496" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="268.0" y="492" font-size="10" font-weight="400" fill="#52626e" text-anchor="start">encrypted records</text>
<path d="M96 195 H44 V449 H96" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M96 222 H66 V371 H96" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<text transform="translate(40,330) rotate(-90)" font-size="10" fill="#52626e">save and load progress</text>
<text transform="translate(62,300) rotate(-90)" font-size="10" fill="#52626e">enqueue</text>
<rect x="470" y="236" width="164" height="104" rx="8" fill="#fff7e0" stroke="#e0a82e" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="482" y="256" font-size="12" font-weight="700" fill="#9a6b00" text-anchor="start">Not connected yet</text>
<text x="482" y="274" font-size="10.5" font-weight="400" fill="#5c4300" text-anchor="start">The client sends no requests</text>
<text x="482" y="289" font-size="10.5" font-weight="400" fill="#5c4300" text-anchor="start">to the backend, and</text>
<text x="482" y="304" font-size="10.5" font-weight="400" fill="#5c4300" text-anchor="start">queue.setSender() is never</text>
<text x="482" y="319" font-size="10.5" font-weight="400" fill="#5c4300" text-anchor="start">called. This link is planned.</text>
<rect x="472" y="372" width="160" height="50" rx="8" fill="#fff7e0" stroke="#e0a82e" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="484" y="393" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">LMS / internal service</text>
<text x="484" y="410" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">not in this repository</text>
<rect x="472" y="438" width="160" height="50" rx="8" fill="#f3f5f7" stroke="#9aa8b2" stroke-width="1.6"/>
<text x="484" y="459" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Employer or verifier</text>
<text x="484" y="476" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">anyone with the link</text>
<rect x="472" y="600" width="160" height="62" rx="8" fill="#fff7e0" stroke="#e0a82e" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="484" y="621" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Static web host</text>
<text x="484" y="638" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">serves the app files</text>
<text x="484" y="653" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">not defined in this repo</text>
<path d="M472 631 H424" fill="none" stroke="#52626e" stroke-width="1.8" marker-end="url(#an)"/>
<text x="436" y="624" font-size="10" font-weight="400" fill="#52626e" text-anchor="start"></text>
<rect x="640" y="120" width="576" height="650" rx="14" fill="#f0f8f6" stroke="#0f766e" stroke-width="2"/>
<text x="660" y="148" font-size="14" font-weight="800" fill="#0b5a54" text-anchor="start">BACKEND API</text>
<text x="660" y="165" font-size="11.5" font-weight="400" fill="#52626e" text-anchor="start">backend/ · Fastify 5 · Node 22</text>
<text x="660" y="180" font-size="10.5" font-weight="400" fill="#52626e" text-anchor="start">Docker: read-only filesystem, all capabilities dropped, 1 GB memory, 256 processes</text>
<rect x="656" y="192" width="544" height="44" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="668" y="211" font-size="12" font-weight="700" fill="#12202b" text-anchor="start">Fastify app (app.ts)</text>
<text x="668" y="227" font-size="10.5" font-weight="400" fill="#52626e" text-anchor="start">helmet headers · 120 requests/min per IP · 64 KB body limit · zod validation of every request</text>
<path d="M741 236 V254" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M928 236 V254" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M1115 236 V254" fill="none" stroke="#0b5a54" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="656" y="254" width="170" height="216" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="668" y="275" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Portfolio</text>
<text x="668" y="292" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">POST /v1/capstones/</text>
<text x="668" y="307" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">  complete (internal key)</text>
<text x="668" y="322" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">POST /v1/portfolios/:id/</text>
<text x="668" y="337" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">  revoke (internal key)</text>
<text x="668" y="352" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">GET /v1/verify/:token</text>
<text x="668" y="367" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">  public, no login</text>
<text x="668" y="382" font-size="11" font-weight="400" fill="#52626e" text-anchor="start"></text>
<text x="668" y="397" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">HMAC-signed tokens</text>
<text x="668" y="412" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">idempotent per learner and</text>
<text x="668" y="427" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">capstone</text>
<rect x="843" y="254" width="170" height="216" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="855" y="275" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Grading</text>
<text x="855" y="292" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">POST /v1/grade/typing</text>
<text x="855" y="307" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">POST /v1/grade/excel</text>
<text x="855" y="322" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">POST /v1/grade/python</text>
<text x="855" y="337" font-size="11" font-weight="400" fill="#52626e" text-anchor="start"></text>
<text x="855" y="352" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">Typing: edit distance + WPM</text>
<text x="855" y="367" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">Excel: HyperFormula engine</text>
<text x="855" y="382" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">Python: Pyodide sandbox</text>
<text x="855" y="397" font-size="11" font-weight="400" fill="#52626e" text-anchor="start"></text>
<text x="855" y="412" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">expected answers are kept</text>
<text x="855" y="427" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">on the server only</text>
<rect x="1030" y="254" width="170" height="216" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="1042" y="275" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Translation</text>
<text x="1042" y="292" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">POST /v1/translate</text>
<text x="1042" y="307" font-size="11" font-weight="400" fill="#52626e" text-anchor="start"></text>
<text x="1042" y="322" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">sanitize, protect code and</text>
<text x="1042" y="337" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">formulas, call the LLM,</text>
<text x="1042" y="352" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">restore, check placeholders</text>
<text x="1042" y="367" font-size="11" font-weight="400" fill="#52626e" text-anchor="start"></text>
<text x="1042" y="382" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">languages: zu, xh, st, tn, af</text>
<text x="1042" y="397" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">lesson text cached 30 days</text>
<text x="1042" y="412" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">learner text never cached</text>
<rect x="656" y="498" width="170" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="668" y="519" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">PostgreSQL 16</text>
<text x="668" y="536" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">one table: portfolios</text>
<text x="668" y="551" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">unique per learner and</text>
<text x="668" y="566" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">capstone</text>
<rect x="843" y="498" width="170" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="855" y="519" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">SandboxPool</text>
<text x="855" y="536" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">warm single-use Pyodide</text>
<text x="855" y="551" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">processes, empty env</text>
<text x="855" y="566" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">SIGKILL on timeout (1.5 s)</text>
<rect x="1030" y="498" width="170" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="1042" y="519" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Redis 7</text>
<text x="1042" y="536" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">translation cache only</text>
<text x="1042" y="551" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">key tr: + SHA-256 hash</text>
<text x="1042" y="566" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">TTL 30 days</text>
<rect x="843" y="608" width="170" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<text x="855" y="629" font-size="13" font-weight="700" fill="#12202b" text-anchor="start">Exercise JSON files</text>
<text x="855" y="646" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">typing, excel and python</text>
<text x="855" y="661" font-size="11" font-weight="400" fill="#52626e" text-anchor="start">exercises with answers</text>
