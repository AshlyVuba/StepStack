<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>StepStack – Get started</title>
  <link rel="stylesheet" href="src/css/onboarding.css">
  <script type="module" src="src/js/onboarding.js"></script>
  <script type="module" src="src/js/workspace.js"></script>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>StepStack</h1>
      <p class="tag">Using small steps to improve your tech stack.</p>
    </header>

    <noscript><p class="notice">StepStack needs JavaScript to set up your learning path.</p></noscript>

    <form id="onboarding" hidden novalidate>
      <progress id="progress" max="3" value="1" aria-label="Setup progress"></progress>

      <fieldset data-step="1">
        <legend>Where are you starting?</legend>
        <div class="options" id="opts-tier"></div>
      </fieldset>

      <fieldset data-step="2" hidden>
        <legend>How comfortable are you now?</legend>
        <div class="options" id="opts-level"></div>
      </fieldset>

      <fieldset data-step="3" hidden>
        <legend>Which language do you think in?</legend>
        <div class="options grid" id="opts-lang"></div>
      </fieldset>

      <nav class="actions">
        <button type="button" id="back" hidden>Back</button>
        <button type="submit" id="done" hidden>Start learning</button>
      </nav>
    </form>

    <section id="welcome" hidden aria-live="polite">
      <h2>Welcome back</h2>
      <p id="summary"></p>
      <div class="actions">
        <button type="button" id="restart">Change my setup</button>
        <button type="button" id="continue" class="primary">Continue</button>
      </div>
    </section>

    <section id="workspace" hidden>
      <div class="lang-bar" role="group" aria-labelledby="ws-lang-label">
        <span id="ws-lang-label" data-i18n="language"></span>
        <div id="ws-langs"></div>
      </div>
      <progress id="ws-progress" max="3" value="0" aria-labelledby="ws-progress-text"></progress>
      <p id="ws-progress-text"></p>
      <ol id="ws-stages"></ol>
      <article>
        <p id="ws-kicker" class="kicker"></p>
        <h2 id="ws-title"></h2>
        <p id="ws-body"></p>
        <button type="button" id="ws-hint-btn" data-i18n="hint"></button>
        <p id="ws-hint" hidden></p>
        <label class="plain" id="ws-answer-label" for="ws-input" data-i18n="answer"></label>
        <input id="ws-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <textarea id="ws-textarea" rows="5" hidden></textarea>
        <div class="actions">
          <button type="button" id="ws-next" hidden data-i18n="next"></button>
          <button type="button" id="ws-check" class="primary" data-i18n="check"></button>
        </div>
        <p id="ws-feedback" role="status"></p>
      </article>
    </section>
  </main>
</body>
</html>
